name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install -U pip wheel
          python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check factominer tests
      - name: Mypy
        run: mypy factominer || true   # advisory until type annotations stabilize
      - name: Pytest (R-fixture-driven; no R needed)
        run: pytest -q
      - name: Sphinx build
        run: sphinx-build -b html docs docs/_build/html

  rpy2-parity:
    # Live cross-check against R FactoMineR. Runs on the weekly schedule
    # and is manually triggerable via workflow_dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install R + FactoMineR
        run: |
          sudo apt-get update
          sudo apt-get install -y r-cran-factominer r-cran-jsonlite
      - name: Install package + rpy2 extras
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,rpy2]'
      - name: Regenerate fixtures + parity
        run: |
          Rscript tools/refresh_r_fixtures.R
          pytest -q -m rpy2 || pytest -q  # rpy2 marker may not be wired yet
